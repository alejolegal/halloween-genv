<div class="admin-tabs">
      <button id="tab-btn-approvals" class="admin-tab active" onclick="switchAdminTab('approvals')">Aprobar Pagos</button>
      <button id="tab-btn-door" class="admin-tab" onclick="switchAdminTab('door')">Control en Puerta (QR / DNI)</button>
    </div>

    <!-- VISTA APROBACIONES -->
    <div id="adm-view-approvals" class="admin-body">
      <div id="adm-pending-list"></div>
    </div>

    <!-- VISTA PUERTA -->
    <div id="adm-view-door" class="admin-body hidden">
      <!-- BOTÓN DESCARGAR PDF -->
      <button onclick="window.exportDoorListPDF()" class="btn-secondary" style="margin-bottom: 1rem; width: 100%; border-color: #38bdf8; color: #38bdf8; font-weight: 700;">
        📥 DESCARGAR PLANILLA DE CONTROL (PDF)
      </button>

      <div class="door-scan-bar">
        <input type="text" id="door-input" placeholder="Escanear QR o tipear DNI / Ticket ID...">
        <button onclick="validateDoorCheckIn()" class="btn-primary">Validar Ingreso</button>
      </div>
      <div id="door-msg" class="door-feedback hidden"></div>
      <div class="door-table-wrapper">
        <div id="adm-door-list" class="door-list"></div>
      </div>
    </div>
