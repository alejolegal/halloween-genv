# Mantiene activo el proyecto de Supabase.
# En el plan gratuito, Supabase pausa un proyecto tras 7 días sin actividad.
# Esta tarea hace UNA consulta de solo lectura por día (estado de las tandas):
# no crea ni modifica datos y no tiene costo.
# Usa la clave pública (anon) que ya está en js/config.js.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 12 * * *'   # todos los días ~09:17 hora Argentina
  workflow_dispatch:         # permite correrla a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Consultar estado de venta
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" js/config.js | head -1)
          KEY=$(grep -o "eyJ[A-Za-z0-9._-]*" js/config.js | head -1)
          for i in 1 2 3; do
            CODE=$(curl -s -o resp.json -w '%{http_code}' -X POST "$URL/rest/v1/rpc/xmas_sales_status" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
            if [ "$CODE" = "200" ]; then
              echo "OK: Supabase respondió ($CODE)"
              exit 0
            fi
            echo "Intento $i: HTTP $CODE"; cat resp.json || true
            sleep 20
          done
          echo "::error::Supabase no respondió. Revisá si el proyecto está pausado en supabase.com/dashboard"
          exit 1
